name: HERE Speed Limit

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: "Широта"
        required: true
        type: string

      longitude:
        description: "Долгота"
        required: true
        type: string

      bearing:
        description: "Направление движения в градусах (необязательно, 0-359)"
        required: false
        type: string
        default: ""

jobs:
  check-speed-limit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check speed limit
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          if [ -n "${{ inputs.bearing }}" ]; then
            python main.py \
              --latitude "${{ inputs.latitude }}" \
              --longitude "${{ inputs.longitude }}" \
              --bearing "${{ inputs.bearing }}"
          else
            python main.py \
              --latitude "${{ inputs.latitude }}" \
              --longitude "${{ inputs.longitude }}"
          fi